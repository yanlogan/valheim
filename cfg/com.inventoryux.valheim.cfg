## Remembered equipment-station view: Default, Type, or Biome.
# Setting type: String
# Default value: Default
WorkbenchGrouping = Default

## Remembered food-station view: Default, Stat, or Biome.
# Setting type: String
# Default value: Default
FoodGrouping = Default

[Diagnostics]

## Write a CSV inventory of the currently loaded vanilla and modded pieces/recipes to BepInEx/config/CraftGuard once per launch.
# Setting type: Boolean
# Default value: false
